# Builds the release binary (SPA embedded, same result as `just build`) for each
# platform and publishes the archives on the Git tag that triggered the run.
#
# Cut a release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  frontend:
    name: Build SPA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@22
          working-directory: frontend
          cache: true
          require-lockfile: true

      - name: Build the SPA
        working-directory: frontend
        run: pnpm build

      - name: Confirm the static fallback page exists
        run: test -f frontend/build/200.html

      - uses: actions/upload-artifact@v7
        with:
          name: spa
          path: frontend/build/**/*
          if-no-files-found: error

  binary:
    name: ${{ matrix.target }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: spa
          path: backend/bin/hushjournal/static

      - name: Confirm the embedded SPA is present
        shell: bash
        run: test -f backend/bin/hushjournal/static/200.html

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install a musl C toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # ring and mimalloc compile C. Point that compiler at musl-gcc, which
      # matches the host architecture on these native runners.
      - name: Select the musl linker
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          underscored="${TARGET//-/_}"
          echo "CC_${underscored}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${underscored^^}_LINKER=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Build
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked --bin hushjournal --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="hushjournal"
          ext="tar.gz"
          if [[ "$TARGET" == *windows* ]]; then
            bin="hushjournal.exe"
            ext="zip"
          fi
          mkdir -p dist
          stage="$(mktemp -d)"
          cp "backend/target/${TARGET}/release/${bin}" "${stage}/${bin}"
          archive="hushjournal-${GITHUB_REF_NAME}-${TARGET}.${ext}"
          if [[ "$ext" == "zip" ]]; then
            tar -C "$stage" -a -cf "dist/${archive}" "$bin"
          else
            tar -C "$stage" -czf "dist/${archive}" "$bin"
          fi
        env:
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: binary
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
