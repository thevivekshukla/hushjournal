services:
  db:
    image: postgres:18
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: hushjournal
      POSTGRES_PASSWORD: hushjournal
      POSTGRES_DB: hushjournal
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "58417:5432"
    volumes:
      - postgres_data_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hushjournal -d hushjournal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_18:
