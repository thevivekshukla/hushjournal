[workspace]
members = [
    "bin/e2ejournal",
    "db",
    "errors",
    "user",
    "user_json",
    "utils",
    "workspace",
    "workspace_json",
]
default-members = ["bin/e2ejournal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8.9"
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
cookie = "0.18"
db = { path = "db" }
dotenvy = "0.15.7"
errors = { path = "errors" }
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rust-embed = { version = "8.9", features = ["debug-embed", "include-exclude", "mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
user = { path = "user" }
user_json = { path = "user_json" }
utils = { path = "utils" }
workspace = { path = "workspace" }
workspace_json = { path = "workspace_json" }
uuid = { version = "1.26.1", features = ["serde", "v7"] }
