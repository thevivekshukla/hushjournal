<!doctype html>
<html lang="en" data-theme="silk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/app/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/app/favicon.svg" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/app/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="HushJournal" />
		<link rel="manifest" href="%sveltekit.assets%/app/site.webmanifest" />
		<script>
			try {
				const stored = localStorage.getItem('theme');
				if (stored === 'silk' || stored === 'dim') {
					document.documentElement.setAttribute('data-theme', stored);
				} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
					document.documentElement.setAttribute('data-theme', 'dim');
				}
			} catch {
				// ignore
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
